configVersion: 2.0.0
generation:
  sdkClassName: SDK
  maintainOpenAPIOrder: true
  usageSnippets:
    optionalPropertyRendering: withExample
    sdkInitStyle: constructor
  useClassNamesForArrayFields: true
  fixes:
    nameResolutionDec2023: true
    nameResolutionFeb2025: true
    parameterOrderingFeb2024: true
    requestResponseComponentNamesFeb2024: true
    securityFeb2025: true
    sharedErrorComponentsApr2025: true
    sharedNestedComponentsJan2026: false
    nameOverrideFeb2026: true
    openSingleValueEnumsOct2026: true
  auth:
    oAuth2ClientCredentialsEnabled: true
    oAuth2PasswordEnabled: false
    hoistGlobalSecurity: true
  sdkHooksConfigAccess: true
  schemas:
    allOfMergeStrategy: shallowMerge
  requestBodyFieldName: ""
  versioningStrategy: automatic
  persistentEdits: {}
  tests:
    generateTests: true
    generateNewTests: true
    skipResponseBodyAssertions: false
  repoUrl: https://github.com/speakeasy-sdks/test-sdk
python:
  version: 0.0.1
  additionalDependencies:
    dev: {}
    main:
      uuid-utils: '>=0.10.0'
  allowedRedefinedBuiltins:
    - id
    - object
  applyUnionDiscriminators: true
  asyncMode: split
  authors:
    - Speakeasy
  baseErrorName: SDKBaseError
  bodyVariantOverloads: false
  clientServerStatusCodesAsErrors: true
  constFieldCasing: normal
  customCasings:
    mcp:
      initialism: true
  defaultErrorName: SDKError
  description: Python Client SDK Generated by Speakeasy.
  durationFormat: false
  enableCustomCodeRegions: true
  enumFormat: union
  envVarPrefix: SPEAKEASY
  errorSchemaValidation: false
  eventStreamClassNames:
    async: EventStreamAsync
    sync: EventStream
  fixFlags:
    asyncPaginationSep2025: true
    conflictResistantModelImportsFeb2026: true
    responseRequiredSep2024: true
  flattenGlobalSecurity: true
  flattenRequests: true
  flatteningOrder: parameters-first
  forwardCompatibleEnumsByDefault: true
  forwardCompatibleUnionsByDefault: tagged-only
  httpClientLibrary: httpx
  imports:
    option: openapi
    paths:
      callbacks: ""
      errors: ""
      operations: ""
      shared: ""
      webhooks: ""
    relative: true
  inferUnionDiscriminators: true
  inputModelSuffix: input
  inputTypedDictSuffix: param
  license: ""
  maxMethodParams: 4
  methodArguments: infer-optional-args
  methodTimeoutArgument: timeout-ms
  methodTimeoutUnits: milliseconds
  modelSerializationMethods: false
  moduleName: speakeasy.new_openapi
  multipartArrayFormat: standard
  optionalDependencies:
    extras: {}
    telemetry:
      opentelemetry-exporter-otlp-proto-http: '>=1.33.1,<2.0.0'
      opentelemetry-sdk: '>=1.33.1,<2.0.0'
  outputModelSuffix: output
  packageManager: uv
  packageName: openapi
  preApplyUnionDiscriminators: false
  preserveUnknownFields: false
  pytestFilterWarnings: []
  pytestTimeout: 0
  rawResponseHelpers: false
  responseFormat: flat
  responseSchemaValidation: lenient
  sseFlatResponse: true
  templateVersion: v2
  useAsyncHooks: true
  uuidFormat: false
