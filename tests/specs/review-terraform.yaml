    DiscriminatedUnionCreateRequest:
      x-speakeasy-entity: DiscriminatedUnion
      type: object
      properties:
        id:
          type: string
          readOnly: true
        item:
          description: Single discriminated union item for 'create' operation
          $ref: '#/components/schemas/DiscriminatedUnionScheme'
      required:
        - item
    DiscriminatedUnionUpdateRequest:
      x-speakeasy-entity: DiscriminatedUnion
      type: object
      properties:
        id:
          type: string
          readOnly: true
        item:
          description: Single discriminated union item for 'update' operation with different variants
          $ref: '#/components/schemas/DiscriminatedUnionSchemeSensitiveDataAware'
      required:
        - item
    DiscriminatedUnionResponse:
      x-speakeasy-entity: DiscriminatedUnion
      type: object
      properties:
        id:
          type: string
          readOnly: true
        item:
          description: Single discriminated union item with sensitive data aware variants
          $ref: '#/components/schemas/DiscriminatedUnionSchemeSensitiveDataAware'
      required:
        - item
    DiscriminatedUnionScheme:
      description: Discriminated union for 'create' operations (non-array)
      discriminator:
        propertyName: type
        mapping:
          item_a: '#/components/schemas/DiscriminatedUnionItemA'
          item_b: '#/components/schemas/DiscriminatedUnionItemB'
          item_c: '#/components/schemas/DiscriminatedUnionItemC'
          item_d: '#/components/schemas/DiscriminatedUnionItemD'
      oneOf:
        - $ref: '#/components/schemas/DiscriminatedUnionItemA'
        - $ref: '#/components/schemas/DiscriminatedUnionItemB'
        - $ref: '#/components/schemas/DiscriminatedUnionItemC'
        - $ref: '#/components/schemas/DiscriminatedUnionItemD'
    DiscriminatedUnionSchemeSensitiveDataAware:
      description: Discriminated union for 'update'/'read' operations with different model names (non-array)
      discriminator:
        propertyName: type
        mapping:
          item_a: '#/components/schemas/DiscriminatedUnionItemAlt'
          item_b: '#/components/schemas/DiscriminatedUnionItemB'
          item_d_alt: '#/components/schemas/DiscriminatedUnionItemD'
      oneOf:
        - $ref: '#/components/schemas/DiscriminatedUnionItemAlt'
        - $ref: '#/components/schemas/DiscriminatedUnionItemB'
        - $ref: '#/components/schemas/DiscriminatedUnionItemD'
    DiscriminatedUnionMapTypeVaryingField:
      description: Schema using additionalProperties (becomes map type). Used to test shared field names with structurally different types across discriminated union variants.
      type: object
      additionalProperties: true
    DiscriminatedUnionClassTypeVaryingField:
      description: Schema with defined properties (becomes class type). Used to test shared field names with structurally different types across discriminated union variants.
      type: object
      properties:
        setting:
          type: string
        enabled:
          type: boolean
      required:
        - setting
    DiscriminatedUnionItemA:
      description: Test case - discriminator key matches, model name matches in 'create'. Has 'type_varying_field' as map type (additionalProperties) to test shared field names with different types across variants.
      type: object
      properties:
        type:
          type: string
          const: item_a
        value_a:
          type: string
        type_varying_field:
          $ref: '#/components/schemas/DiscriminatedUnionMapTypeVaryingField'
      required:
        - type
        - value_a
    DiscriminatedUnionItemAlt:
      description: Test case - discriminator key 'item_a' matches ItemA, but different model name (tests the bug fix). Has 'type_varying_field' as map type matching ItemA.
      type: object
      properties:
        type:
          type: string
          const: item_a
        value_a_sensitive:
          type: string
        type_varying_field:
          $ref: '#/components/schemas/DiscriminatedUnionMapTypeVaryingField'
      required:
        - type
    DiscriminatedUnionItemB:
