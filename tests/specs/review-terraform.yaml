    - $ref: '#/components/parameters/GlobalEnumInt32'
    - $ref: '#/components/parameters/GlobalEnumInt64'
    - $ref: '#/components/parameters/GlobalEnumInteger'
    - $ref: '#/components/parameters/GlobalEnumNumber'
    - $ref: '#/components/parameters/GlobalEnumString'
    - $ref: '#/components/parameters/GlobalFloat32'
