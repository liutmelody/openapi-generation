  /v0/xpolling:
    post:
      x-speakeasy-entity-operation: XPolling#create
      description: Create a new x-speakeasy-polling resource, which uses polling to wait for resource readiness
      operationId: create-x-polling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XPollingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XPollingResponse'
  /v0/xpolling/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      x-speakeasy-entity-operation: XPolling#delete
      description: Delete a x-speakeasy-polling resource
      operationId: delete-x-polling
      responses:
        '200':
          description: OK
    get:
      x-speakeasy-entity-operation:
        - XPolling#read
        - entityOperation: XPolling#create#2
          options:
            polling:
              delaySeconds: 2
              intervalSeconds: 2
              limitCount: 120
              name: WaitForCompletedNameOverride
        - entityOperation: XPolling#update#2
          options:
            polling:
              name: WaitForCompletedNameOverride
        - entityOperation: XPolling#delete#2
          options:
            polling:
              name: WaitForNotFound
      description: Get a x-polling resource
      operationId: get-x-polling
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XPollingResponse'
      x-speakeasy-polling:
        - name: WaitForCompleted
          failureCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/status == "failed"
          successCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/status == "completed"
        - name: WaitForCompletedNameOverride
          failureCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/status_name_overridden == "failed"
          successCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/status_name_overridden == "completed"
        - name: WaitForNotFound
          successCriteria:
            - condition: $statusCode == 404
    patch:
      x-speakeasy-entity-operation: XPolling#update
      description: Update a x-speakeasy-polling resource
      operationId: update-x-polling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XPollingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XPollingResponse'
