    RootUnionWriteOnly:
      x-speakeasy-entity: RootUnionWriteOnly
      description: >
        Entity placed directly on a oneOf so the resource model itself is the
        union. One variant nests a writeOnly property inside an object, the
        other inside an array of objects, verifying prior state is captured
        before the variant is reallocated during refresh and threaded into
        container refresh loops
      oneOf:
        - $ref: '#/components/schemas/RootUnionWriteOnlyAlpha'
        - $ref: '#/components/schemas/RootUnionWriteOnlyBeta'
    RootUnionWriteOnlyAlpha:
      type: object
      description: First root-union variant with a nested writeOnly property
      properties:
        id:
          type: string
          description: Resource identifier
          readOnly: true
        name:
          type: string
          description: Resource name
        kind:
          type: string
          description: Variant discriminating value
          enum:
            - alpha
        credentials:
          type: object
          description: Nested object mixing readable and writeOnly properties
          properties:
            client_id:
              type: string
              description: Readable client identifier
            client_secret:
              type: string
              description: Secret not returned by read operations
              writeOnly: true
              x-speakeasy-terraform-plan-only: true
          required:
            - client_id
            - client_secret
      required:
        - name
        - kind
        - credentials
    RootUnionWriteOnlyBeta:
      type: object
      description: >
        Second root-union variant nesting writeOnly properties inside an array
        of objects, verifying the prior collection is sourced from the variant
        captured before reallocation rather than the freshly reset variant
      properties:
        id:
          type: string
          description: Resource identifier
          readOnly: true
        name:
          type: string
          description: Resource name
        kind:
          type: string
          description: Variant discriminating value
          enum:
            - beta
        credentials:
          type: array
          description: Array of objects mixing readable and writeOnly properties
          items:
            type: object
            properties:
              client_id:
                type: string
                description: Readable client identifier
              client_secret:
                type: string
                description: Secret not returned by read operations
                writeOnly: true
                x-speakeasy-terraform-plan-only: true
            required:
              - client_id
              - client_secret
      required:
        - name
        - kind
        - credentials
