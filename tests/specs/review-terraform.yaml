    - $ref: '#/components/parameters/GlobalFloat64'
    - $ref: '#/components/parameters/GlobalFloat64WithDefault'
    - $ref: '#/components/parameters/GlobalInt32'
    - $ref: '#/components/parameters/GlobalInt32WithDefault'
    - $ref: '#/components/parameters/GlobalInt64'
    - $ref: '#/components/parameters/GlobalInt64WithDefault'
    - $ref: '#/components/parameters/GlobalInteger'
    - $ref: '#/components/parameters/GlobalIntegerWithDefault'
