configVersion: 2.0.0
generation:
  sdkClassName: SDK
  usageSnippets:
    optionalPropertyRendering: withExample
  fixes:
    nameResolutionDec2023: false
    securityFeb2025: true
    nameOverrideFeb2026: false
    openSingleValueEnumsOct2026: false
  tests:
    generateTests: true
    generateNewTests: false
  auth:
    oAuth2ClientCredentialsEnabled: true
  sdkHooksConfigAccess: true
python:
  forwardCompatibleUnionsByDefault: tagged-only
  eventStreamClassNames:
    sync: Stream
    async: AsyncStream
  fixFlags:
    conflictResistantModelImportsFeb2026: true
  forwardCompatibleEnumsByDefault: true
  inferUnionDiscriminators: true
  version: 0.0.1
  author: Speakeasy
  clientServerStatusCodesAsErrors: true
  description: Python Client SDK Generated by Speakeasy
  flattenGlobalSecurity: false
  imports:
    option: openapi
    paths:
      callbacks: models/callbacks
      errors: models/errors
      operations: models/operations
      shared: models/shared
      webhooks: models/webhooks
  maxMethodParams: 5
  flattenRequests: false
  preserveUnknownFields: true
  packageName: openapi
  rawResponseHelpers: true
  responseFormat: flat
  enumFormat: enum
  pytestFilterWarnings:
    - error::RuntimeWarning
    # Ensure __del__ method warnings are raised
    - error::pytest.PytestUnraisableExceptionWarning
  pytestTimeout: 300
  templateVersion: v2
  packageManager: uv
  defaultErrorName: Error  # Conflicts with existing error class -> 'DefaultError'
  baseErrorName: DefaultError  # Conflicts with new default error -> 'DefaultBaseError'
  errorSchemaValidation: false
  responseSchemaValidation: false
  asyncMode: split
