configVersion: 2.0.0
generation:
  sdkClassName: SDK
  tests:
    generateTests: true
    generateNewTests: false
python:
  packageName: openapi
  version: 0.0.1
  templateVersion: v2
  packageManager: uv
  preserveUnknownFields: true
  modelSerializationMethods: false
  forwardCompatibleUnionsByDefault: tagged-only
  inferUnionDiscriminators: true
  flattenRequests: false
  responseFormat: envelope-http
