  test-postman:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-postman == 'true'
    timeout-minutes: 15
    name: Test Postman
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: "read"
      actions: "read"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            zSDKs/**/go.sum
      - name: Test
        env:
          SPEAKEASY_GENERATED_LICENSE: agpl-3.0-only
        run: make build-postman

      - name: Check if working tree is dirty
        run: ./scripts/check-generated-diff.sh

  check:
    timeout-minutes: 15
    if: always()
    name: Check
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions: {}
    needs:
      - detect-targets
      - test-generator
      - test-cli
      - test-cli-coverage
      - test-csharp
      - test-csharp-coverage
      - test-go
      - test-go-coverage
      - test-javav2
      - test-javav2-coverage
      - test-mcp-typescript
      - test-mcp-typescript-coverage
      - test-php
      - test-php-coverage
      - test-pythonv2
      - test-pythonv2-coverage
      - test-ruby
      - test-ruby-coverage
      - test-terraform-primary
      - test-terraform-secondary
      - test-terraform-tertiary
      - test-terraform-quaternary
      - test-terraform-client-credentials
      # - test-terraform-oauth2-password
      - test-terraform-review
      - test-typescriptv2
      - test-typescriptv2-coverage
      - test-postman
      # - test-unity
    steps:
      - name: Verify every selected test target completed successfully
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_CLI: ${{ needs.detect-targets.outputs.run-cli }}
          RUN_CSHARP: ${{ needs.detect-targets.outputs.run-csharp }}
          RUN_GO: ${{ needs.detect-targets.outputs.run-go }}
          RUN_JAVAV2: ${{ needs.detect-targets.outputs.run-javav2 }}
          RUN_MCP_TYPESCRIPT: ${{ needs.detect-targets.outputs.run-mcp-typescript }}
          RUN_PHP: ${{ needs.detect-targets.outputs.run-php }}
          RUN_PYTHONV2: ${{ needs.detect-targets.outputs.run-pythonv2 }}
          RUN_RUBY: ${{ needs.detect-targets.outputs.run-ruby }}
          RUN_TERRAFORM: ${{ needs.detect-targets.outputs.run-terraform }}
          RUN_TYPESCRIPTV2: ${{ needs.detect-targets.outputs.run-typescriptv2 }}
          RUN_POSTMAN: ${{ needs.detect-targets.outputs.run-postman }}
        run: |
          set -euo pipefail

          require_success() {
            local job="$1"
            local result
            result="$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS_JSON")"
            if [[ "$result" != "success" ]]; then
              echo "::error::Required job $job completed with $result"
              return 1
            fi
          }

          require_success detect-targets
          require_success test-generator

          if [[ "$RUN_CLI" == "true" ]]; then
            require_success test-cli
            require_success test-cli-coverage
          fi
          if [[ "$RUN_CSHARP" == "true" ]]; then
            require_success test-csharp
            require_success test-csharp-coverage
          fi
          if [[ "$RUN_GO" == "true" ]]; then
            require_success test-go
            require_success test-go-coverage
          fi
          if [[ "$RUN_JAVAV2" == "true" ]]; then
            require_success test-javav2
            require_success test-javav2-coverage
          fi
          if [[ "$RUN_MCP_TYPESCRIPT" == "true" ]]; then
            require_success test-mcp-typescript
            require_success test-mcp-typescript-coverage
          fi
          if [[ "$RUN_PHP" == "true" ]]; then
            require_success test-php
            require_success test-php-coverage
          fi
          if [[ "$RUN_PYTHONV2" == "true" ]]; then
            require_success test-pythonv2
            require_success test-pythonv2-coverage
          fi
          if [[ "$RUN_RUBY" == "true" ]]; then
            require_success test-ruby
            require_success test-ruby-coverage
          fi
          if [[ "$RUN_TERRAFORM" == "true" ]]; then
            require_success test-terraform-primary
            require_success test-terraform-secondary
            require_success test-terraform-tertiary
            require_success test-terraform-quaternary
            require_success test-terraform-client-credentials
            require_success test-terraform-review
          fi
          if [[ "$RUN_TYPESCRIPTV2" == "true" ]]; then
            require_success test-typescriptv2
            require_success test-typescriptv2-coverage
          fi
          if [[ "$RUN_POSTMAN" == "true" ]]; then
            require_success test-postman
          fi
