    if: needs.detect-targets.outputs.run-cli == 'true'
    uses: ./.github/workflows/test-cli.yml
    with:
      test-group: "client-credentials"
  test-cli-client-credentials-basic:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-cli == 'true'
    uses: ./.github/workflows/test-cli.yml
    with:
      test-group: "client-credentials-basic"
  test-cli-basic-http:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-cli == 'true'
    uses: ./.github/workflows/test-cli.yml
    with:
      test-group: "basic-http"
  test-cli-custom-http:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-cli == 'true'
    uses: ./.github/workflows/test-cli.yml
    with:
      test-group: "custom-http"
  test-cli-oauth2-password:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-cli == 'true'
