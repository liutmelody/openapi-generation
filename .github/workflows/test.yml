name: Test
on:
  push:
    branches:
      - main
      - hotfixes
  merge_group:
  pull_request:
    branches:
      - main
      - hotfixes
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  SPEAKEASY_DEBUG: "true"
jobs:
  detect-targets:
    uses: ./.github/workflows/detect-targets.yml

  test-generator:
    timeout-minutes: 45
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: "read"
      actions: "read"
    env:
      SPEAKEASY_DEBUG: "false" # Override SPEAKEASY_DEBUG to false for generator tests or they will fail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            zSDKs/**/go.sum
            services/**/go.sum

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "corretto"
          java-version: "11"
      - uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: "8.14"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Configure Composer
        run: |
          composer config --global preferred-install auto
          composer config --global process-timeout 300
      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php-dist-v3-${{ runner.os }}-${{ hashFiles('templates/templates/php/**/composer.json.stmpl') }}

      - name: Build Generator
        run: make build

      - name: Test Generator
        env:
          GO_TEST_TIMEOUT: 25m
          SPEAKEASY_LICENSE_TOKEN: ${{ secrets.SPEAKEASY_LICENSE_TOKEN }}
          SPEAKEASY_GENERATED_LICENSE: ${{ secrets.SPEAKEASY_LICENSE_TOKEN == '' && 'agpl-3.0-only' || '' }}
        run: make test-generator

      - name: Test Validator
        env:
          SPEAKEASY_GENERATED_LICENSE: agpl-3.0-only
        run: make test-validate

      - name: Test Readme
        env:
          SPEAKEASY_GENERATED_LICENSE: agpl-3.0-only
        run: make test-readme

  test-cli-primary:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-cli == 'true'
    uses: ./.github/workflows/test-cli.yml
    with:
      test-group: "primary"
  test-cli-secondary:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-cli == 'true'
    uses: ./.github/workflows/test-cli.yml
