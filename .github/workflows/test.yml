  test-cli-relative-servers:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-cli == 'true'
    uses: ./.github/workflows/test-cli.yml
    with:
      test-group: "relative-servers"
  test-cli-review:
    needs: [detect-targets]
    if: needs.detect-targets.outputs.run-cli == 'true'
    uses: ./.github/workflows/test-cli.yml
    with:
      test-group: "review"
  test-cli:
    if: always() && needs.detect-targets.outputs.run-cli == 'true'
    needs:
      - detect-targets
      - test-cli-primary
      - test-cli-secondary
      - test-cli-tertiary
      - test-cli-quaternary
      - test-cli-client-credentials
      - test-cli-client-credentials-basic
      - test-cli-basic-http
      - test-cli-custom-http
      - test-cli-oauth2-password
      - test-cli-no-servers
      - test-cli-security-options
      - test-cli-relative-servers
      - test-cli-review
    uses: ./.github/workflows/check-variants.yml
    with:
      needs-json: ${{ toJSON(needs) }}
  test-cli-coverage:
    needs: [test-cli]
    if: needs.test-cli.result == 'success'
    uses: ./.github/workflows/test-coverage.yml
    with:
