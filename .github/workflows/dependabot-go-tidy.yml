name: Dependabot Go Tidy
on:
    workflow_run:
        workflows: [Go Lint]
        types: [completed]

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: dependabot-go-tidy-${{ github.event.workflow_run.id }}
    cancel-in-progress: true

jobs:
    tidy:
        if: >-
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.actor.login == 'dependabot[bot]' &&
            startsWith(github.event.workflow_run.head_branch, 'dependabot/go_modules/') &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubicloud-standard-2
        steps:
            - name: Validate Dependabot changes
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                  PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
              run: |
                  if [[ -z "$PR_NUMBER" ]]; then
                    echo "No pull request is associated with this workflow run."
                    exit 1
                  fi

                  pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
                  [[ "$(jq -r '.user.login' <<<"$pr")" == "dependabot[bot]" ]]
                  [[ "$(jq -r '.head.sha' <<<"$pr")" == "$HEAD_SHA" ]]
                  [[ "$(jq -r '.head.repo.full_name' <<<"$pr")" == "$GITHUB_REPOSITORY" ]]
                  [[ "$(jq -r '.head.ref' <<<"$pr")" == dependabot/go_modules/* ]]

                  changed_files="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
                  invalid_files="$(printf '%s\n' "$changed_files" | grep -Ev '(^|/)go\.(mod|sum)$' || true)"
                  if [[ -n "$invalid_files" ]]; then
                    echo "Refusing to run with non-module changes:"
                    printf '%s\n' "$invalid_files"
                    exit 1
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: |
                      go.sum
                      cmd/**/go.sum
                      services/**/go.sum

            # Keep this list explicit so privileged automation never executes scripts
            # from the pull request branch.
            - name: Tidy maintained Go modules
              run: |
                  go mod tidy
                  (cd cmd/wasm && go mod tidy)
                  (cd cmd/wasm/ast && GOWORK=off go mod tidy)
                  (cd cmd/wasm/full-stack && GOWORK=off go mod tidy)
                  (cd cmd/wasm/overlay && GOWORK=off go mod tidy)
                  (cd services/speakeasy-api-test-service && GOWORK=off go mod tidy)

            - name: Validate tidy output
              run: |
                  invalid_files="$(git diff --name-only | grep -Ev '(^|/)go\.(mod|sum)$' || true)"
                  if [[ -n "$invalid_files" ]]; then
                    echo "Refusing to commit non-module changes:"
                    printf '%s\n' "$invalid_files"
                    exit 1
                  fi

            - name: Generate automation token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                app-id: ${{ vars.GENERATOR_BOT_APP_ID }}
                private-key: ${{ secrets.GENERATOR_BOT_PRIVATE_KEY }}
                permission-contents: write

            - name: Commit tidy output
              env:
                  BRANCH: ${{ github.event.workflow_run.head_branch }}
                  PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  if git diff --quiet; then
                    echo "Go modules are already tidy."
                    exit 0
                  fi
                  if [[ -z "$PUSH_TOKEN" ]]; then
                    echo "An automation token is required to update Dependabot branches."
                    exit 1
                  fi

                  git config user.name "speakeasybot"
                  git config user.email "support@speakeasy.com"
                  git add -- go.mod go.sum ':(glob)**/go.mod' ':(glob)**/go.sum'
                  git commit -m "chore: tidy Go modules"
                  git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
