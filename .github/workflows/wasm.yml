name: WASM Build Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-wasm:
    name: Build and Validate WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "./cmd/wasm/go.mod"
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            zSDKs/**/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.34.4

      - name: Install dependencies
        run: pnpm install --ignore-scripts
        working-directory: ./cmd/wasm

      - name: Rebuild install-script dependencies
        run: pnpm rebuild esbuild
        working-directory: ./cmd/wasm

      - name: Build WASM
        run: cd ./cmd/wasm && ./build-all.sh

      - name: Verify WASM binaries exist
        run: |
          # Check all granular binaries
          for binary in overlay ast full-stack; do
            if [ ! -f "./cmd/wasm/assets/wasm/${binary}.wasm.gz" ]; then
              echo "WASM binary not found at expected location: ./cmd/wasm/assets/wasm/${binary}.wasm.gz"
              exit 1
            fi
            if [ ! -f "./cmd/wasm/assets/wasm/${binary}.wasm.br" ]; then
              echo "WASM binary not found at expected location: ./cmd/wasm/assets/wasm/${binary}.wasm.br"
              exit 1
            fi
          done

      - name: Verify wasm_exec.js exists
        run: |
          if [ ! -f ./cmd/wasm/assets/wasm/wasm_exec.js ]; then
            echo "wasm_exec.js not found at expected location: ./cmd/wasm/assets/wasm/wasm_exec.js"
            exit 1
          fi

      - name: Run tests
        run: pnpm test
        working-directory: ./cmd/wasm
