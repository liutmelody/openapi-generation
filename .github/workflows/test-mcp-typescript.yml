name: Test MCP TypeScript
on:
  workflow_call:
    inputs:
      test-group:
        required: true
        type: string
env:
  SPEAKEASY_DEBUG: "true"
jobs:
  test-mcp-typescript:
    timeout-minutes: 30
    name: Test MCP TypeScript - ${{ inputs.test-group }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: "read"
      actions: "read"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            zSDKs/**/go.sum
            services/**/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Test
        env:
          SPEAKEASY_GENERATED_LICENSE: agpl-3.0-only
        run: TARGET=${{ inputs.test-group }} NODE_OPTIONS="--experimental-global-webcrypto" make test-mcp-typescript
      # Prevent test coverage (will be added in near future) from failing the workflow
      - if: inputs.test-group != 'review'
        run: touch ./testSDKs/mcp-typescript-${{ inputs.test-group }}/test-mcp-typescript-record.txt
      - name: git diff
        run: ./scripts/check-generated-diff.sh
      - name: Upload test report
        if: inputs.test-group != 'review'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-typescript-${{ inputs.test-group }}-test-report
          path: ./testSDKs/mcp-typescript-${{ inputs.test-group }}/test-mcp-typescript-record.txt
          if-no-files-found: error
