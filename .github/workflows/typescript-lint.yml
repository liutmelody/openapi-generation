name: TypeScript Lint
on:
  merge_group:
  pull_request:
    paths:
      - .github/workflows/typescript-lint.yml
      - .prettierignore
      - .prettierrc
      - package.json
      - "**tsconfig.json"
      - "**.ts"
permissions:
  contents: read
jobs:
  prettier:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.x"
      - run: npm ci
      - run: |
          if ! npm run check:format; then
            echo "🚨 Please format your JS/TS files with prettier."
            exit 1
          fi
  tsgo:
    name: "tsgo - ${{ matrix.template }}"
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        template:
          - csharp
          - go
          - javav2
          - mcp-typescript
          - mockserver
          - php
          - postman
          - pythonv2
          - ruby
          - terraform
          - typescriptv2
          - unity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.x"
      - run: npm ci
      - run: "npx tsgo --project templates/templates/${{ matrix.template }}"
